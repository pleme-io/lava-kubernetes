[package]
authors = ["pleme-io"]
description = "lava-kubernetes — autogenerated typed (deflava-resource …) shapes for the kubernetes terraform provider. Mirrors pangea-kubernetes. Source schema kept under schema.json; resources/*.tlisp + _index.tlisp regenerated via `lava-forge generate --schema schema.json --out resources`."
edition = "2024"
license = "MIT"
name = "lava-kubernetes"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-kubernetes"
version = "0.1.1"

[lib]
name = "lava_kubernetes"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"
